[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seongju_melon_detector"
version = "0.1.0"
description = "Custom camera package with buffer, runner, and gemini336"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools.packages.find]
include = ["camera"]

[tool.setuptools.package-data]
"camera" = [
    "__init__.py",
    "buffer.py",
    "camera_runner.py",
    "gemini336.py"
]
